<svg width="280" height="56" viewBox="0 0 280 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ClikCar brand signature — icon + wordmark -->

  <!-- Icon: overlapping screens with click cursor -->
  <rect x="2" y="8" width="26" height="20" rx="3.5" stroke="#ffffff" stroke-width="2.4"/>
  <rect x="14" y="18" width="26" height="20" rx="3.5" stroke="#ffffff" stroke-width="2.4"/>
  <line x1="35" y1="34" x2="39" y2="38" stroke="#A8CF4C" stroke-width="3" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="52" y="35" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#ffffff">Clik</tspan><tspan fill="#A8CF4C">Car</tspan>
  </text>
</svg>
